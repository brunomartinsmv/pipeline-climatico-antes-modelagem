[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline-climatico-antes-modelagem"
version = "0.2.0"
description = "Exemplo didático de preparação rastreável de dados climáticos antes da modelagem."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND CC-BY-4.0"
license-files = ["LICENSE", "LICENSE-CODE"]
authors = [{ name = "Bruno Martins M. Vieira" }]
keywords = ["climate data", "data pipeline", "ERA5", "reanalysis", "reproducible research", "teaching"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Natural Language :: Portuguese (Brazilian)",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
  "pandas>=2.2,<4",
  "numpy>=1.26,<3",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
notebook = ["jupyter"]
dev = ["pytest>=8,<10", "ruff>=0.8"]

[project.urls]
Repository = "https://github.com/brunomartinsmv/pipeline-climatico-antes-modelagem"
Issues = "https://github.com/brunomartinsmv/pipeline-climatico-antes-modelagem/issues"

[tool.setuptools]
packages = ["pipeline_climatico"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["E402"]
