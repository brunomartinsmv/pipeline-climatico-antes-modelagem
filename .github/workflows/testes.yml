name: Testes

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    name: Lint, testes e pipeline (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    env:
      MPLCONFIGDIR: /tmp/matplotlib-cache

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Instalar o projeto
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Testes
        run: python -m pytest

      - name: Executar o pipeline completo
        run: python -m pipeline_climatico tudo
